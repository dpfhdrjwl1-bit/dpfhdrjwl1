<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4시스템 | 아름다운 곳의 영상</title>
<meta name="description" content="감동이 있고 아름다운 영상의 힘입니다 - 4시스템">
<style>
:root{--blue:#1a73e8;--blue-d:#1557b0;--ink:#202124;--mute:#5f6368;--line:#dadce0;--bg:#f8f9fa}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:#fff;line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:5}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
.logo{font-size:22px;color:var(--mute)}.logo b{color:var(--blue);font-weight:700}
nav a{margin-left:20px;color:var(--mute);text-decoration:none;font-size:15px}
nav a:hover{color:var(--blue)}
.hero{padding:72px 0 40px;text-align:center}
.hero h1{font-size:clamp(28px,6vw,48px);font-weight:400;margin:0 0 12px;line-height:1.3}
.hero p{color:var(--mute);font-size:clamp(16px,2.6vw,20px);margin:0 0 28px}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;padding:14px 32px;border-radius:999px;font-size:17px;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--blue-d)}
.main-video{max-width:960px;margin:32px auto 0;border-radius:20px;overflow:hidden;background:#000;box-shadow:0 1px 6px #0003}
.main-video video{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
section{padding:64px 0}
section.alt{background:var(--bg)}
h2{font-size:28px;font-weight:400;margin:0 0 8px;text-align:center}
.sub{text-align:center;color:var(--mute);margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;align-items:start}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card video{width:100%;display:block;background:#000;max-height:520px;object-fit:contain}
.card p{margin:0;padding:12px 16px;color:var(--mute);font-size:15px}
.about{text-align:center;max-width:620px;margin:0 auto;font-size:20px}
form{max-width:520px;margin:0 auto;display:grid;gap:16px}
label{font-size:15px;color:var(--mute)}
input,textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font:inherit;margin-top:4px;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.hp{position:absolute;left:-9999px}
#msg{text-align:center;min-height:24px}
.contact{text-align:center;color:var(--mute);margin-top:24px}
.contact a{color:var(--blue);text-decoration:none}
footer{padding:24px 0;text-align:center;color:var(--mute);font-size:14px;border-top:1px solid var(--line)}
.fab{position:fixed;right:16px;bottom:16px;z-index:9;box-shadow:0 2px 8px #0004;padding:12px 22px;font-size:16px}
</style>
</head>
<body>
<header><div class="wrap"><span class="logo"><b>4</b>시스템</span>
<nav><a href="#places">아름다운 곳</a><a href="#about">소개</a><a href="#contact">상담</a></nav></div></header>

<div class="hero"><div class="wrap">
<h1>감동이 있고<br>아름다운 영상의 힘입니다</h1>
<p>아름다운 곳의 풍경을 영상으로 담습니다</p>
<a class="btn" href="#contact">상담 신청하기</a>
<div class="main-video">
<video src="media/v1.mp4" poster="media/v1.jpg" controls muted loop playsinline preload="metadata"></video>
</div>
</div></div>

<section id="places" class="alt"><div class="wrap">
<h2>아름다운 곳</h2>
<p class="sub">직접 담은 장면들입니다</p>
<div class="grid">
<div class="card"><video src="media/v2.mp4" poster="media/v2.jpg" controls muted loop playsinline preload="none"></video><p>눈 쌓인 거리</p></div>
<div class="card"><video src="media/v3.mp4" poster="media/v3.jpg" controls muted loop playsinline preload="none"></video><p>설산 풍경</p></div>
<div class="card"><video src="media/v4.mp4" poster="media/v4.jpg" controls muted loop playsinline preload="none"></video><p>겨울의 한 장면</p></div>
</div></div></section>

<section id="about"><div class="wrap">
<h2>소개</h2>
<p class="about">감동이 있고 아름다운 영상의 힘입니다</p>
</div></section>

<section id="contact" class="alt"><div class="wrap">
<h2>상담 신청</h2>
<p class="sub">남겨 주시면 확인 후 연락드립니다</p>
<form id="f">
<div><label>이름 *<input name="name" maxlength="50" required></label></div>
<div><label>연락처 *<input name="phone" maxlength="30" required inputmode="tel"></label></div>
<div><label>문의 내용<textarea name="message" rows="4" maxlength="1000"></textarea></label></div>
<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="btn" type="submit" id="b">상담 신청 보내기</button>
<div id="msg" role="status"></div>
</form>
<p class="contact">전화 <a href="tel:01075611719">010-7561-1719</a> · 이메일 dpfhdrjwl1@gmail.com</p>
</div></section>

<footer>© 4시스템</footer>
<a class="btn fab" href="#contact">상담 신청</a>

<script>
var ENDPOINT = "https://script.google.com/macros/s/AKfycbxPMzAKBdZwG9j0hmfeTkm5xETiLXyCEfK_hO2H7A_1AjGMOxbCEW56zJkj95Y7qZJazA/exec";
var f = document.getElementById("f"), msg = document.getElementById("msg"), b = document.getElementById("b");
f.addEventListener("submit", function (e) {
  e.preventDefault();
  var d = new FormData(f);
  var data = { name: d.get("name"), phone: d.get("phone"), message: d.get("message"), website: d.get("website") };
  if (!data.name.trim() || !data.phone.trim()) { msg.textContent = "이름과 연락처를 입력해 주세요."; return; }
  b.disabled = true; msg.textContent = "보내는 중...";
  fetch(ENDPOINT, { method: "POST", body: JSON.stringify(data) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      msg.textContent = j.ok ? "접수되었습니다. 곧 연락드릴게요!" : "접수하지 못했어요: " + (j.error || "다시 시도해 주세요.");
      if (j.ok) f.reset();
    })
    .catch(function () { msg.textContent = "전송에 실패했어요. 전화로 문의해 주세요."; })
    .finally(function () { b.disabled = false; });
});
</script>
</body>
</html>
